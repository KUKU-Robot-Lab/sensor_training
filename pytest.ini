[pytest]
addopts = -p no:launch_ros -p no:launch_testing
# `.` → common, robot_skin ; `deformable_sats` → sats, hitmap (legacy imports unchanged)
pythonpath = . deformable_sats
testpaths =
    common/tests
    robot_skin/tests
    deformable_sats/hitmap/tests
    deformable_sats/sats/training/tests
