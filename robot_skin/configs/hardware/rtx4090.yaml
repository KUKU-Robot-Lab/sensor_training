# Hardware profile: NVIDIA GeForce RTX 4090 (Ada Lovelace, compute capability 8.9, 24 GB).
# Any CUDA 11.8+/12.x torch wheel ships sm_89-compatible kernels.
name: rtx4090
gpu:
  vendor: nvidia
  model: GeForce RTX 4090
  arch: ada
  compute_capability: [8, 9]
  memory_gb: 24
  bf16: true
  min_torch_cuda: "11.8"

train:
  device: auto
  precision: bf16
  tf32: true
  compile: true
  num_workers: 8
  pin_memory: true

suggest:                    # same effective batch as rtx5090 (less memory → more accumulation)
  imu_pose: {batch_size: 512, grad_accum: 1}
  baseline: {batch_size: 1024, grad_accum: 1}
  contact:  {batch_size: 512, grad_accum: 1}
  pretrain: {batch_size: 128, grad_accum: 2}
  vtla:     {batch_size: 32, grad_accum: 4}

env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

notes: >-
  Consumer Ada cards have no NVLink and no GPU peer-to-peer; if multi-GPU NCCL all-reduce hangs,
  try NCCL_P2P_DISABLE=1.
