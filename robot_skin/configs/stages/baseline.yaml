# Stage `baseline`: temporal no-contact baseline (motion artefact) predictor.
# Runner: robot_skin.stages.baseline.run(cfg)  (python -m robot_skin.stages.baseline --config <this>)
# Trains on the no-contact frames of D1 episodes; writes derived baseline_pred / baseline_logvar /
# residual for every episode of predict_datasets, <out_dir>/baseline_model.pt, joint_stats.json, metrics.json.
# Keys mirror robot_skin.stages.baseline.DEFAULTS (kept in sync by a test; unknown keys raise).
stage: baseline
hardware: null                  # rtx5090 | rtx4090 | rtx3090 | a100 | cpu | auto | null
hardware_applied: false         # load_stage_config sets it after applying `hardware` (then --set overrides win)
out_dir: null                   # null → train.out_dir

data:
  processed_root: robot_skin/data/processed
  datasets: [motion]            # training pool (D1); split into train / val / test below
  predict_datasets: [motion, task]   # derived outputs are written for these
  episodes: null                # explicit episode dirs (replace the discovery; the dataset lists still select)
  splits: null                  # splits.json (robot_skin.datasets.splits) — use the same file for every stage
  use_test: false               # also train on the test split
  split_by: episode             # fallback split when splits is null: episode | subject
  val_frac: 0.2
  split_seed: 0
  kind: null                    # glove | robot | null (all) — one model per layout: set it for mixed data
  stride: 2                     # every 2nd 200 Hz frame as a training window end
  q_source: q                   # q (vision hand pose / robot joints) | hand_pose_imu (imu_pose stage output)
  only_labels: [0]              # contact_label values that count as no-contact targets
  exclude_saturated: true
  min_valid: 1                  # a window is used when ≥ this many taxels are valid targets
  require_q_valid: true         # glove: every frame of the window has a measured hand pose

stats:
  method: std                   # q / qd normalisation fit on the train split (std | robust | none)

target_scale:                   # per-taxel ΔS scale (RMS of no-contact ΔS) inside the model
  enabled: true
  floor_pct: 0.05

crossfit:                       # out-of-fold derived arrays for the TRAIN episodes (contact / pretrain train on
                                #   them; in-sample residuals are much tighter than on unseen data → leakage)
  folds: 3                      # extra models, one per fold (0 / 1 → off: train residuals stay in-sample)
  by: auto                      # auto (splits.json grouping, else data.split_by) | episode | subject

model:                          # baseline.temporal.TemporalBaselinePredictor
  window: 32                    # history frames (160 ms at 200 Hz)
  hidden: 64
  taxel_emb_dim: 8
  kernel: 3
  n_layers: 4                   # TCN dilations 1..8 → receptive field 31 ≤ window
  arch: tcn                     # tcn | gru
  head_hidden: 64
  dropout: 0.0
  pos_scale: 10.0               # taxel positions m → dm
  use_pose: true
  sigma0: 1.0                   # initial σ in target-scale units
  logvar_min: -12.0
  logvar_max: 8.0
  var_detach: true              # log-variance head on stop-gradient features

loss:                           # baseline.temporal.baseline_loss (target-scale units)
  mean_loss: mse                # mse | huber | none (none + detach_mean false + var_detach false = joint NLL)
  mean_weight: 1.0
  nll_weight: 1.0               # Gaussian NLL (Kendall & Gal 2017) for the variance
  detach_mean: true
  huber_delta: 1.0

eval:
  moving_qd_rms: 0.2            # rad/s: joint-speed RMS above which a no-contact frame counts as "moving"

predict:
  write_derived: true
  batch_size: 4096

train:                          # robot_skin.train.TrainConfig (hardware profile suggest.baseline overrides batch)
  max_epochs: 30
  batch_size: 256
  lr: 3.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.05
  grad_clip: 1.0
  precision: auto
  ema_decay: null
  monitor: val/loss
  log_every: 50
  seed: 0
  out_dir: robot_skin/runs/baseline
