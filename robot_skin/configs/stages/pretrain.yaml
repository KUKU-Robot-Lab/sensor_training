# Stage `pretrain`: MAE-style masked-taxel pretraining of the tactile TaxelEncoder.
# Runner: robot_skin.stages.pretrain.run(cfg)  (python -m robot_skin.stages.pretrain --config <this>)
# Needs the contact stage's derived residual_z / contact_level in every processed episode.
# Outputs <out_dir>/encoder_state.pt ({config, state_dict}; load_pretrained_encoder) + metrics.json.
# Keys mirror robot_skin.stages.pretrain.DEFAULTS (kept in sync by a test).
stage: pretrain
hardware: null                  # rtx5090 | rtx4090 | rtx3090 | a100 | cpu | auto | null
hardware_applied: false         # load_stage_config sets it after applying `hardware` (then --set overrides win)
out_dir: null                   # null → train.out_dir

data:
  processed_root: robot_skin/data/processed
  datasets: [motion, task]      # D1 + D2 (self-supervised: no labels needed)
  episodes: null                # explicit list of episode dirs (overrides the discovery above)
  splits: null                  # splits.json from robot_skin.datasets.splits (train/val/test); use the
                                # VTLA splits so its test episodes stay unseen (null: val_frac split of all)
  use_test: false               # also pretrain on test episodes (transductive; off by default)
  split_by: episode             # fallback split when splits is null: episode | subject
  val_frac: 0.2
  split_seed: 0
  frame_stride: 4               # every 4th 200 Hz frame (50 Hz) — neighbouring frames are near-duplicates
  contact_repeat: 1             # >1 oversamples frames with any WEAK/STRONG/SATURATED taxel
  use_groups: true              # layout groups (fingertip, finger_*, palm) for group masking
  max_group_frac: 0.5           # groups covering more than this fraction of taxels are not maskable
  layout: null                  # override the layout used for groups (default: episode meta.layout)

features:                       # representation.TactileFeatureSpec — stored in encoder_state.pt
  obs_mode: full                # full (6/taxel) | ordinal (4) | binary (1); none has no values
  history: 1                    # stacked frames k (value_dim = frame_dim × k)
  stride: 1                     # master-clock ticks between stacked frames
  z_clip: 100.0                 # |z| clip before asinh compression
  z_scale: 2.0                  # zf = asinh(clip(z) / z_scale)

model:                          # representation.TaxelEncoder
  d_model: 64
  depth: 2
  heads: 4
  ff_mult: 4
  dropout: 0.0
  n_fourier: 6                  # octaves; finest period = fourier_scale / 2**(n_fourier-1) ≈ 9 mm
  fourier_scale: 0.3            # m, base (lowest-octave) period of the position Fourier features —
                                # ≥ hand size, and no octave finer than mm-level pose-label noise
  n_taxels: null                # per-index id embedding (single-layout only; breaks glove/robot sharing)

pretrain:                       # representation.MaskedTaxelPretrainer
  mask_ratio: 0.3
  mask_mode: mixed              # random | group | mixed
  group_prob: 0.5               # mixed: probability of hiding a whole layout group
  decoder_dim: null             # null → d_model
  decoder_depth: 1
  decoder_heads: null           # null → model.heads
  huber_delta: 1.0              # on zf units
  z_weight: 1.0
  level_weight: 1.0
  level_class_weights: balanced # balanced | none | [w_none, w_weak, w_strong, w_saturated]
  class_weight_power: 0.5       # balanced: w ∝ freq^-power
  class_weight_max: 10.0
  eval_seed: 0                  # fixed validation masks

eval:
  batch_size: 512
  seed: 0

train:                          # robot_skin.train.TrainConfig (hardware profile suggest.pretrain overrides batch)
  max_epochs: 20
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.05
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.05
  grad_clip: 1.0
  precision: auto
  ema_decay: null
  monitor: val/loss
  log_every: 50
  seed: 0
  out_dir: robot_skin/runs/pretrain
